<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ημερολόγιο Δράσεων · 3ο Γυμνάσιο Πολίχνης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0F3;
    --card:#FFFFFF;
    --ink:#131E29;
    --muted:#5E6E7D;
    --line:#D7DFE6;
    --blue:#1F5C8B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.45;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 16px 70px}

  header.top{background:var(--blue);color:#fff;padding:20px 0 16px}
  header.top .wrap{padding-bottom:0}
  .school{font-size:13px;font-weight:500;opacity:.85;margin:0}
  h1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:2px 0 0}
  .year{font-size:14px;opacity:.85;margin:3px 0 0}

  .bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
  .months{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .months-inner{display:flex;gap:6px;max-width:780px;margin:0 auto;padding:10px 16px 4px}
  .mbtn{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    font:inherit;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px;
    cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  }
  .mbtn:hover{border-color:#B4C3CF;color:var(--ink)}
  .mbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
  .mbtn:focus-visible{outline:3px solid #7FB2D8;outline-offset:2px}
  .badge{
    min-width:19px;height:19px;padding:0 5px;border-radius:999px;
    background:#E4761F;color:#fff;font-size:12px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .mbtn[aria-pressed="true"] .badge{background:#fff;color:var(--blue)}
  .mbtn .none{font-size:12px;opacity:.55;font-weight:400}

  .navrow{max-width:780px;margin:0 auto;padding:10px 16px 2px;display:flex;align-items:center;gap:8px}
  .arrow{
    flex:0 0 auto;width:40px;height:40px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--blue);
    font-size:20px;line-height:1;font-weight:600;
  }
  .arrow:hover:not(:disabled){background:var(--blue);border-color:var(--blue);color:#fff}
  .arrow:disabled{opacity:.35;cursor:default}
  .msel{
    flex:1 1 auto;min-width:0;height:40px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:16px;font-weight:600;text-align:center;
    padding:0 10px;-webkit-appearance:none;appearance:none;
  }
  .arrow:focus-visible,.msel:focus-visible{outline:3px solid #7FB2D8;outline-offset:2px}
  .hint{max-width:780px;margin:0 auto;padding:2px 16px 0;font-size:12.5px;color:var(--muted)}

  .filters{max-width:780px;margin:0 auto;padding:4px 16px 10px}
  .counts{font-size:13px;color:var(--muted)}

  h2.month{font-size:20px;font-weight:600;margin:24px 0 14px}

  /* --- Δράση: το βασικό στοιχείο της σελίδας --- */
  .ev{
    display:flex;gap:0;border:1px solid rgba(19,30,41,.14);
    border-radius:12px;margin-bottom:10px;overflow:hidden;
    box-shadow:0 1px 2px rgba(19,30,41,.07);
  }
  .stripe{flex:0 0 9px;background:#CBD5DD;filter:brightness(.72)}
  .ev-body{display:flex;gap:14px;padding:13px 15px 13px 13px;flex:1 1 auto;min-width:0}
  .datebox{flex:0 0 54px;text-align:center;padding-top:1px}
  .dnum{display:block;font-size:31px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .dname{display:block;font-size:12.5px;color:#42525F;margin-top:2px;font-weight:500}
  .main{flex:1 1 auto;min-width:0}
  .title{font-size:17.5px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
  .time{
    display:inline-block;background:#13324A;color:#fff;font-size:13px;font-weight:600;
    padding:2px 8px;border-radius:6px;margin-bottom:5px;font-variant-numeric:tabular-nums;
  }
  .meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chip{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;color:#1B2A36;white-space:nowrap}
  .ev .chip{font-weight:600;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(19,30,41,.1)}
  .sub{font-size:13.5px;color:#3B4C5A}
  .note{font-size:13.5px;color:#3B4C5A;margin-top:5px}

  /* Διακριτικές κατηγορίες: λευκή κάρτα, μικρότερα στοιχεία, λεπτή έγχρωμη λωρίδα */
  .ev.quiet{background:rgba(255,255,255,.7);border-color:var(--line);box-shadow:none}
  .ev.quiet .stripe{flex-basis:4px;filter:none}
  .ev.quiet .ev-body{padding:10px 14px 10px 12px;gap:12px}
  .ev.quiet .datebox{flex-basis:46px}
  .ev.quiet .dnum{font-size:23px;font-weight:600;color:#42525F}
  .ev.quiet .dname{font-size:12px;color:var(--muted);font-weight:400}
  .ev.quiet .title{font-size:15px;font-weight:500;color:#2B3945}
  .ev.quiet .time{background:none;color:var(--muted);padding:0;font-size:12.5px;margin-bottom:2px}
  .ev.quiet .meta{margin-top:4px}
  .ev.quiet .chip{background:#EDF1F4;box-shadow:none;font-size:12px;font-weight:500;color:#54636F}
  .ev.quiet .sub,.ev.quiet .note{font-size:12.5px;color:var(--muted)}
  .ev.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,92,139,.18)}
  .flag{
    display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--blue);
    padding:2px 8px;border-radius:5px;margin-bottom:6px;
  }
  .flag.next{background:#E4761F}

  /* --- Αργίες: διακριτικές, σε μία γραμμή --- */
  .off{
    display:flex;align-items:center;gap:10px;padding:8px 14px;margin-bottom:6px;
    background:rgba(255,255,255,.55);border:1px dashed var(--line);border-radius:9px;
    color:var(--muted);font-size:14.5px;
  }
  .off .dot{flex:0 0 9px;height:9px;border-radius:50%;background:#F4B6B6}
  .off .when{font-weight:600;color:#42525F;white-space:nowrap}

  .empty,.state{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:26px;text-align:center;color:var(--muted);margin-top:20px;
  }
  .state.err{border-color:#E0B4B4;color:#8A3A3A;background:#FDF4F4;text-align:left}
  .legend{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
  .legend .chip{opacity:.9}
  footer{margin-top:18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--blue)}

  @media (max-width:430px){
    h1{font-size:22px}
    .datebox{flex-basis:46px}
    .dnum{font-size:27px}
    .title{font-size:16.5px}
  }
  @media print{
    .bar,footer{display:none}
    header.top{background:#fff;color:#000}
    .ev,.off{break-inside:avoid;border-color:#999}
    .ev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="school">3ο Γυμνάσιο Πολίχνης</p>
    <h1>Ημερολόγιο Δράσεων</h1>
    <p class="year" id="schoolyear">Σχολικό έτος 2026–27</p>
  </div>
</header>

<div class="bar" id="bar" hidden>
  <div class="navrow">
    <button class="arrow" id="prev" type="button" title="Προηγούμενος μήνας" aria-label="Προηγούμενος μήνας">‹</button>
    <select class="msel" id="msel" aria-label="Επιλογή μήνα"></select>
    <button class="arrow" id="next" type="button" title="Επόμενος μήνας" aria-label="Επόμενος μήνας">›</button>
  </div>
  <p class="hint">Άλλαξε μήνα με τα βελάκια, τη λίστα ή τα κουμπιά πιο κάτω.</p>
  <div class="months"><div class="months-inner" id="monthsInner"></div></div>
  <div class="filters">
    <span class="counts" id="counts"></span>
  </div>
</div>

<main class="wrap">
  <div id="content"><div class="state">Φόρτωση δράσεων…</div></div>
  <div class="legend" id="legend" hidden></div>
  <footer>
    <span id="updated"></span>
    <a href="#" id="reload">Ανανέωση</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ---- Ρυθμίσεις -------------------------------------------------------------
const FILE  = "draseis.xlsx";   // το όνομα του αρχείου Excel μέσα στο repo
const SHEET = "ΔΡΑΣΕΙΣ";        // το φύλλο με τα δεδομένα
const QUIET = ["Αργία / Διακοπές"];   // κατηγορίες που εμφανίζονται σε μία γραμμή
const LOUD  = ["Εορτή / Εκκλησιασμός","Δράση"];  // με γεμάτο χρώμα
const ACTION = "Δράση";              // μόνο αυτή η κατηγορία μετράει ως «δράση» στα πλήθη δίπλα στους μήνες
// ---------------------------------------------------------------------------

const MONTHS = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος",
                "Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const MSHORT = ["Ιαν","Φεβ","Μαρ","Απρ","Μάι","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
const DAYS   = ["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];

const COLORS = {
  "Αργία / Διακοπές":              "#F4B6B6",
  "Εορτή / Εκκλησιασμός":          "#FFE08A",
  "Εκδρομή / Επίσκεψη / Περίπατος":"#B7DE9C",
  "Σύλλογος διδασκόντων":          "#D0CECE",
  "Ενημέρωση γονέων / Έλεγχοι":    "#F9C08A",
  "Ορόσημο / Εξετάσεις":           "#A9CDEB",
  "Δράση":                         "#C4B5DC",
  "Δράση / Πρόγραμμα / Όμιλος":    "#9FD8CE"
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = v => (v===null||v===undefined) ? "" : String(v).trim();
const isQuiet = cat => QUIET.indexOf(cat) > -1;
const isLoud  = cat => LOUD.indexOf(cat) > -1;
const isAction = cat => cat === ACTION;

let months = {}, keys = [], active = null, nextKey = null, usedCats = [];

function parseDate(v){
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); return d ? new Date(d.y,d.m-1,d.d) : null; }
  if (typeof v === "string"){
    const m = v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m){ let y = +m[3]; if (y<100) y += 2000; return new Date(y, +m[2]-1, +m[1]); }
    const d = new Date(v); if (!isNaN(d)) return d;
  }
  return null;
}

function load(){
  $("content").innerHTML = '<div class="state">Φόρτωση δράσεων…</div>';
  fetch(FILE + "?t=" + Date.now(), {cache:"no-store"})
    .then(r => {
      if(!r.ok) throw new Error("HTTP " + r.status);
      const lm = r.headers.get("last-modified");
      if (lm) $("updated").textContent = "Τελευταία ενημέρωση: " +
        new Date(lm).toLocaleDateString("el-GR",{day:"numeric",month:"long",year:"numeric"});
      return r.arrayBuffer();
    })
    .then(b => build(new Uint8Array(b)))
    .catch(e => {
      $("content").innerHTML = '<div class="state err"><b>Δεν φορτώθηκε το αρχείο.</b><br>Έλεγξε ότι το ' +
        '<code>' + FILE + '</code> βρίσκεται στο ίδιο repo με τη σελίδα. (' + e.message + ')</div>';
    });
}

function build(data){
  // Χωρίς cellDates: οι ημερομηνίες μένουν σειριακοί αριθμοί και μετατρέπονται
  // στην parseDate, αλλιώς η ζώνη ώρας τις μετατοπίζει κατά μία ημέρα.
  const wb = XLSX.read(data,{type:"array"});
  const ws = wb.Sheets[SHEET] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{defval:null});

  months = {}; const cats = {};
  rows.forEach(r => {
    const d = parseDate(r["ΗΜΕΡΟΜΗΝΙΑ"]), title = val(r["ΤΙΤΛΟΣ ΔΡΑΣΗΣ"]);
    if (!d || !title) return;
    const mk = d.getFullYear() + "-" + pad(d.getMonth()+1);
    const item = {
      date:d, title:title, cat:val(r["ΚΑΤΗΓΟΡΙΑ"]), time:val(r["ΩΡΕΣ"]),
      classes:val(r["ΤΑΞΕΙΣ / ΤΜΗΜΑΤΑ"]), who:val(r["ΥΠΕΥΘΥΝΟΣ"]), note:val(r["ΣΗΜΕΙΩΣΕΙΣ"]),
      key: d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())
    };
    (months[mk] = months[mk] || []).push(item);
    if (item.cat) cats[item.cat] = true;
  });

  keys = Object.keys(months).sort();
  if (!keys.length){ $("content").innerHTML = '<div class="state">Δεν βρέθηκαν δράσεις στο αρχείο.</div>'; return; }
  keys.forEach(k => months[k].sort((a,b) => a.date - b.date));
  usedCats = Object.keys(cats);

  // Η επόμενη πραγματική δράση από σήμερα
  const today = new Date(); today.setHours(0,0,0,0);
  outer: for (const k of keys) for (const it of months[k])
    if (!isQuiet(it.cat) && it.date >= today){ nextKey = it.key + "|" + it.title; break outer; }

  const y1 = +keys[0].slice(0,4), y2 = +keys[keys.length-1].slice(0,4);
  $("schoolyear").textContent = "Σχολικό έτος " + y1 + "–" + String(y2).slice(2);

  const cur = today.getFullYear() + "-" + pad(today.getMonth()+1);
  active = keys.indexOf(cur) > -1 ? cur : (keys.find(k => k >= cur) || keys[keys.length-1]);

  const nav = $("monthsInner"); nav.innerHTML = "";
  keys.forEach(k => {
    const n = months[k].filter(i => isAction(i.cat)).length;
    const b = document.createElement("button");
    b.className = "mbtn"; b.type = "button"; b.dataset.k = k;
    b.innerHTML = MSHORT[+k.slice(5)-1] + " " + k.slice(2,4) +
      (n ? '<span class="badge">' + n + '</span>' : '<span class="none">–</span>');
    b.onclick = () => show(k);
    nav.appendChild(b);
  });

  const sel = $("msel"); sel.innerHTML = "";
  keys.forEach(k => {
    const n = months[k].filter(i => isAction(i.cat)).length;
    const o = document.createElement("option");
    o.value = k;
    o.textContent = MONTHS[+k.slice(5)-1] + " " + k.slice(0,4) +
      (n ? "  (" + n + (n === 1 ? " δράση)" : " δράσεις)") : "  (—)");
    sel.appendChild(o);
  });
  sel.onchange = () => show(sel.value);

  $("legend").innerHTML = usedCats.map(c =>
    '<span class="chip" style="background:' + (COLORS[c]||"#E8EDF1") + '">' + esc(c) + '</span>').join("");
  $("legend").hidden = false;
  $("bar").hidden = false;
  show(active);
}

function evHTML(it, todayKey){
  const color = COLORS[it.cat] || "#CBD5DD";
  const isNext = (it.key + "|" + it.title) === nextKey;
  const loud = isLoud(it.cat);
  let h = '<article class="ev' + (loud ? "" : " quiet") + (it.key === todayKey ? " today" : "") + '"' +
    (loud ? ' style="background:' + color + '"' : "") + '>' +
    '<div class="stripe" style="background:' + color + '"></div><div class="ev-body">' +
    '<div class="datebox"><span class="dnum">' + it.date.getDate() + '</span>' +
    '<span class="dname">' + DAYS[it.date.getDay()].slice(0,3) + '</span></div><div class="main">';
  if (it.key === todayKey) h += '<span class="flag">Σήμερα</span> ';
  else if (isNext) h += '<span class="flag next">Επόμενη δράση</span> ';
  if (it.time) h += '<div><span class="time">' + esc(it.time) + '</span></div>';
  h += '<div class="title">' + esc(it.title) + '</div>';
  const bits = [];
  if (it.classes) bits.push(esc(it.classes));
  if (it.who) bits.push("Υπεύθυνος: " + esc(it.who));
  h += '<div class="meta">';
  if (it.cat) h += '<span class="chip">' + esc(it.cat) + '</span>';
  if (bits.length) h += '<span class="sub">' + bits.join(" · ") + '</span>';
  h += '</div>';
  if (it.note) h += '<div class="note">' + esc(it.note) + '</div>';
  return h + '</div></div></article>';
}

function offHTML(o){
  const same = o.from.getTime() === o.to.getTime();
  const when = same
    ? o.from.getDate() + " " + MSHORT[o.from.getMonth()] + ", " + DAYS[o.from.getDay()]
    : o.from.getDate() + "–" + o.to.getDate() + " " + MSHORT[o.to.getMonth()];
  return '<div class="off"><span class="dot"></span><span class="when">' + when +
         '</span><span>' + esc(o.title) + '</span></div>';
}

// Ενώνει συνεχόμενες μέρες αργίας με τον ίδιο τίτλο σε μία γραμμή
function mergeQuiet(list){
  const out = [];
  list.forEach(it => {
    const last = out[out.length-1];
    if (last && last.title === it.title){
      const gap = (it.date - last.to) / 86400000;
      let bridge = true;
      for (let i=1; i<gap; i++){
        const d = new Date(last.to.getTime() + i*86400000);
        if (d.getDay() !== 0 && d.getDay() !== 6) bridge = false;
      }
      if (gap >= 1 && gap <= 4 && bridge){ last.to = it.date; return; }
    }
    out.push({title:it.title, from:it.date, to:it.date});
  });
  return out;
}

function show(k){
  active = k;
  const i = keys.indexOf(k);
  $("msel").value = k;
  $("prev").disabled = (i <= 0);
  $("next").disabled = (i >= keys.length - 1);
  document.querySelectorAll(".mbtn").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  const btn = document.querySelector('.mbtn[data-k="' + k + '"]');
  if (btn) btn.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});

  const list = months[k] || [];
  const acts = list.filter(i => !isQuiet(i.cat));
  const offs = mergeQuiet(list.filter(i => isQuiet(i.cat)));
  const t = new Date(), todayKey = t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());

  const nAct = acts.filter(i => isAction(i.cat)).length;
  $("counts").textContent = [
    nAct ? nAct + (nAct === 1 ? " δράση" : " δράσεις") : "καμία δράση",
    offs.length ? offs.length + (offs.length === 1 ? " αργία" : " αργίες") : ""
  ].filter(Boolean).join(" · ");

  // Ένα ενιαίο χρονολογικό ρεύμα: δράσεις και αργίες στη σειρά της ημερομηνίας τους.
  // Οι αργίες μπαίνουν με την πρώτη τους μέρα και, σε ισοβαθμία, πριν από τη δράση.
  const stream = acts.map(it => ({when:it.date, it:it}))
    .concat(offs.map(o => ({when:o.from, o:o})))
    .sort((a,b) => (a.when - b.when) || ((b.o?1:0) - (a.o?1:0)));

  let html = '<h2 class="month">' + MONTHS[+k.slice(5)-1] + " " + k.slice(0,4) + "</h2>";
  if (!acts.length) html += '<div class="empty">Δεν έχει προγραμματιστεί δράση αυτόν τον μήνα.</div>';
  html += stream.map(x => x.o ? offHTML(x.o) : evHTML(x.it, todayKey)).join("");
  $("content").innerHTML = html;
}

$("prev").onclick = () => { const i = keys.indexOf(active); if (i > 0) show(keys[i-1]); };
$("next").onclick = () => { const i = keys.indexOf(active); if (i < keys.length-1) show(keys[i+1]); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});
$("reload").onclick = e => { e.preventDefault(); load(); };
load();
</script>
</body>
</html>
